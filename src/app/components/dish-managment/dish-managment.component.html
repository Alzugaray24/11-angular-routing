<app-header></app-header>
<div class="dish-management">
  <div class="dish-management__sidebar">
    <h1 class="dish-management__title">Gestión de Platos</h1>
    <p class="dish-management__description">
      Administra los platos del sistema con las opciones disponibles a
      continuación.
    </p>
    <div class="dish-management__actions">
      <div
        *ngFor="let action of actions"
        class="dish-management__action"
        (click)="navigateTo(action.route)"
      >
        <div class="dish-management__icon">🍽️</div>
        <div class="dish-management__info">
          <h2 class="dish-management__action-title">{{ action.title }}</h2>
          <p class="dish-management__action-description">
            {{ action.description }}
          </p>
        </div>
      </div>
    </div>
  </div>
  <div class="dish-management__content">
    <router-outlet></router-outlet>
  </div>
</div>
