<div class="menu-list">
  <div class="menu-list__container">
    <h1 class="menu-list__title">Lista de Menús</h1>
    <div
      *ngIf="message"
      [ngClass]="{
        'menu-list__message--success': messageType === 'success',
        'menu-list__message--error': messageType === 'error'
      }"
      class="menu-list__message"
    >
      {{ message }}
    </div>
    <ul class="menu-list__items">
      <li *ngFor="let menu of menus" class="menu-list__item">
        <div class="menu-list__info">
          <span class="menu-list__item-id">Id: {{ menu.id }}</span>
          <span class="menu-list__item-name">Nombre: {{ menu.name }}</span>
          <ul class="menu-list__dishes">
            <li *ngFor="let dish of menu.dishes" class="menu-list__dish">
              {{ dish.name }}
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </div>
</div>
