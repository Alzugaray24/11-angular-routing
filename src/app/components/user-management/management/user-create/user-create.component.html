<div class="form">
  <form class="form__container" (ngSubmit)="saveCustomer()">
    <label for="name" class="form__label">Nombre</label>
    <input
      id="name"
      type="text"
      [(ngModel)]="customerName"
      name="name"
      placeholder="Ingrese su nombre"
      class="form__input"
      required
    />
    <button type="submit" class="form__button">Enviar</button>
  </form>
  <div
    *ngIf="message"
    [ngClass]="{
      'form__message--success': messageType === 'success',
      'form__message--error': messageType === 'error'
    }"
    class="form__message"
  >
    {{ message }}
  </div>
</div>
