<div class="form">
  <form class="form__container" (ngSubmit)="updateCustomer()">
    <label for="id" class="form__label">ID del Cliente</label>
    <input
      id="id"
      type="number"
      [(ngModel)]="customerId"
      name="id"
      placeholder="Ingrese el ID del cliente"
      class="form__input"
      required
    />
    <label for="name" class="form__label">Nombre</label>
    <input
      id="name"
      type="text"
      [(ngModel)]="customerName"
      name="name"
      placeholder="Ingrese el nombre del cliente"
      class="form__input"
      required
    />
    <button type="submit" class="form__button">Actualizar</button>
  </form>
</div>
