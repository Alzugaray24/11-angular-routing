<app-header></app-header>
<div class="user-management">
  <div class="user-management__sidebar">
    <h1 class="user-management__title">Gestión de Usuarios</h1>
    <p class="user-management__description">
      Administra usuarios del sistema con las opciones disponibles a
      continuación.
    </p>
    <div class="user-management__actions">
      <div
        *ngFor="let action of actions"
        class="user-management__action"
        (click)="navigateTo(action.route)"
      >
        <div class="user-management__icon">👤</div>
        <div class="user-management__info">
          <h2 class="user-management__action-title">{{ action.title }}</h2>
          <p class="user-management__action-description">
            {{ action.description }}
          </p>
        </div>
      </div>
    </div>
  </div>
  <div class="user-management__content">
    <app-error></app-error>
    <router-outlet></router-outlet>
  </div>
</div>
